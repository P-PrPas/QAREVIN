[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qarevin"
version = "0.1.0"
description = "Evidence-driven XAUUSD research and guarded execution"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "pyarrow>=19,<25", "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=2.3,<3", "PyYAML>=6,<7", "cryptography>=44,<51"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
qarevin = "qarevin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
